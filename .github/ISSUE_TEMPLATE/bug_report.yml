name: Bug 报告
description: 报告 Kindle for Agents 的安装、配置、转换或投送问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请只提供复现问题所需的信息。

        **不要粘贴 QQ 密码、邮箱授权码、Amazon 登录信息、OTP、验证码、二维码内容或其他凭据。**

  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kindle for Agents 版本
      description: 请粘贴 `kindle --version` 的输出，或填写所用提交的 commit SHA。
      placeholder: 例如：0.2.1
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 出现问题的阶段
      options:
        - 安装或升级
        - 首次配置
        - EPUB 转换或 dry-run
        - 邮件服务商投送
        - Kindle 设备或 App 接收
        - 状态查询或确认
        - 其他
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请列出从干净起点到问题出现时执行的命令和操作；敏感值请替换为 `<已删除>`。
      placeholder: |
        1. 运行……
        2. 执行……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你原本期望看到什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请粘贴完整错误信息或描述实际现象；先删除邮箱地址、本机用户名、文件路径、任务编号和所有凭据。
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏后的诊断结果
      description: 可运行 `kindle --json doctor`，填写未通过的检查项及其信息。不要提交未经检查的原始输出。
      placeholder: 例如：发送通道连通性未通过；已删除本机路径和账号信息。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认内容中不含密码、邮箱授权码、OTP、验证码、二维码内容或其他凭据。
          required: true
        - label: 我已搜索现有 Issues，未找到相同问题。
          required: true
        - label: 如果邮件仅返回 `provider_accepted`，我没有把它当作 Kindle 设备已收到的证明。
          required: true
